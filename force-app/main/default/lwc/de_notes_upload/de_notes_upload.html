<template>
  <div class="dic dic-root">
    <div class="dic-blob dic-blob-1" aria-hidden="true"></div>
    <div class="dic-blob dic-blob-2" aria-hidden="true"></div>

    <div class="dic-surface">
      <div class="dic-inner">
        <header class="dic-hdr">
          <div class="dic-hdr-left">
            <div class="dic-ico" aria-hidden="true">
              <svg
                class="dic-ico-svg"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <polyline
                  points="14 2 14 8 20 8"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <line x1="12" y1="18" x2="12" y2="12" stroke-width="2" stroke-linecap="round" />
                <line x1="9" y1="15" x2="15" y2="15" stroke-width="2" stroke-linecap="round" />
              </svg>
            </div>
            <h2 class="dic-title">
              {displayTitle}
              <span class="dic-title-grad">{displayTitleGrad}</span>
            </h2>
          </div>
        </header>

        <p class="dic-hint">{displayHint}</p>

        <div class="dic-drop" aria-busy={uploading}>
          <input
            data-dnu="file"
            class="dic-file-input"
            type="file"
            accept={fileAccept}
            onchange={handleFileChange}
            disabled={uploading}
          />
          <button
            type="button"
            class="dic-btn dic-btn-primary"
            onclick={handlePickClick}
            disabled={uploading}
          >
            <span if:false={uploading}>Choose file</span>
            <span if:true={uploading}>Uploading…</span>
          </button>
          <p class="dic-fname" if:true={displayFileName}>{displayFileName}</p>
        </div>

        <template if:true={showPreview}>
          <div class="dic-preview-wrap">
            <div class="dic-preview" style={previewStyle} role="img" aria-label="Uploaded file preview"></div>
          </div>
        </template>

        <template if:true={showError}>
          <div class="dic-err" role="alert">
            <p class="dic-err-t">{errorMessage}</p>
          </div>
        </template>

        <p class="dic-ok" if:true={hasFile}>{successLine}</p>

        <template if:true={showFlowNext}>
          <div class="dic-flow">
            <button
              class="dic-fnext"
              type="button"
              title="Next"
              disabled={flowNextDisabled}
              onclick={handleFlowNext}
            >
              <span>Next</span>
              <svg
                class="dic-fnext-ico"
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                aria-hidden="true"
              >
                <line
                  x1="5"
                  y1="12"
                  x2="19"
                  y2="12"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                />
                <polyline
                  points="12 5 19 12 12 19"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </template>
      </div>
    </div>
  </div>
</template>
