<template>
  <div class="decp-shell slds-m-around_small decp-font">
    <div
      class="decp-panel"
      role="region"
      aria-label="conflict check"
    >
      <div class="decp-panel-hd">
        <div class="decp-panel-hd-left">
          <div
            class="decp-hd-icon"
            aria-hidden="true"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
            >
              <path
                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
                fill="none"
                stroke="#fff"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <line
                x1="12"
                y1="9"
                x2="12"
                y2="13"
                stroke="#fff"
                stroke-width="2"
              />
              <line
                x1="12"
                y1="17"
                x2="12.01"
                y2="17"
                stroke="#fff"
                stroke-width="2"
              />
            </svg>
          </div>
          <div>
            <div class="decp-title">{panelTitle}</div>
            <div class="decp-meta">{panelMetaLine}</div>
          </div>
        </div>
        <button
          class="decp-refresh"
          type="button"
          title="Refresh"
          disabled={refreshDisabled}
          onclick={handleRefresh}
        >
          <svg
            width="11"
            height="11"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            aria-hidden="true"
          >
            <polyline points="23 4 23 10 17 10" />
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
          </svg>
          Refresh
        </button>
      </div>

      <template lwc:if={showMissingId}>
        <p class="decp-miss">{missingHelp}</p>
        <div class="decp-ft">
          <div class="decp-ftn">This component must be on a record page to receive the record Id.</div>
        </div>
      </template>
      <template lwc:else>
      <template lwc:if={loading}>
        <div class="decp-in">
          <lightning-spinner
            alternative-text="Loading"
            size="medium"
          ></lightning-spinner>
        </div>
      </template>
      <template lwc:elseif={isError}>
        <div
          class="decp-alert decp-err"
          role="alert"
        >
          <div
            class="decp-alert-ico"
            aria-hidden="true"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
            >
              <path
                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
                fill="none"
                stroke="#9B1C1C"
                stroke-width="2.2"
              />
            </svg>
          </div>
          <div>
            <div class="decp-alert-t">Could not run conflict check</div>
            <p class="decp-alert-d">{_result.message}</p>
          </div>
        </div>
        <div class="decp-ft">
          <div class="decp-ftn">Resolve the error and use Refresh to try again.</div>
        </div>
      </template>
      <template lwc:elseif={hasConflict}>
        <div
          class="decp-alert"
          role="alert"
        >
          <div
            class="decp-alert-ico"
            aria-hidden="true"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
            >
              <path
                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
                fill="none"
                stroke="#9B1C1C"
                stroke-width="2.2"
              />
            </svg>
          </div>
          <div>
            <div class="decp-alert-t">Conflict detected — review before you proceed</div>
            <p class="decp-alert-d">
              Related open work has been flagged. Coordinate with the
              respective case owner(s) before you take any action.
            </p>
          </div>
        </div>
        <div
          lwc:if={contextStripHtml}
          class="decp-context"
        >
          <lightning-formatted-rich-text value={contextStripHtml}></lightning-formatted-rich-text>
        </div>
        <div class="decp-body">
          <template lwc:if={hasType1Block}>
            <div class="decp-block">
              <div class="decp-th">
                <div class="decp-pill decp-t1p">Same client</div>
                <span class="decp-count">{type1Count} records</span>
                <div class="decp-rule-line"></div>
              </div>
              <div class="decp-ol decp-ol1">
                <div class="decp-ol-ico"></div>
                <span
                >Another open case for the <b>same client</b> is or was
                  assigned to a different partner. Coordinate with the
                  other owner(s) before proceeding.</span
                >
              </div>
              <div class="decp-grid">
                <template
                  for:each={type1ForView}
                  for:item="row"
                >
                  <article
                    class="decp-tile decp-tile--t1"
                    key={row.key}
                  >
                    <div class="decp-tile-top">
                      <div class="decp-tile-caseid">
                        <svg
                          class="decp-tile-ico"
                          width="10"
                          height="10"
                          viewBox="0 0 24 24"
                          fill="none"
                          aria-hidden="true"
                        >
                          <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="2"
                            stroke="#0070D2"
                            stroke-width="2.5"
                          />
                          <path
                            d="M3 9h18M9 21V9"
                            stroke="#0070D2"
                            stroke-width="2.5"
                          />
                        </svg>
                        <span>{row.caseNumber}</span>
                      </div>
                      <div
                        class="decp-tile-type decp-tile-type--t1"
                      >
                        <svg
                          class="decp-tile-ico"
                          width="9"
                          height="9"
                          viewBox="0 0 24 24"
                          fill="none"
                          aria-hidden="true"
                        >
                          <circle
                            cx="12"
                            cy="12"
                            r="10"
                            stroke="currentColor"
                            stroke-width="2.5"
                          />
                          <line
                            x1="15"
                            y1="9"
                            x2="9"
                            y2="15"
                            stroke="currentColor"
                            stroke-width="2.5"
                          />
                          <line
                            x1="9"
                            y1="9"
                            x2="15"
                            y2="15"
                            stroke="currentColor"
                            stroke-width="2.5"
                          />
                        </svg>
                        <span>Same client</span>
                      </div>
                    </div>
                    <template lwc:if={row.showForCase}>
                      <div class="decp-tile-anchor decp-tile-anchor--t1">
                        <div class="decp-tile-anchor-lab">Checked in context of</div>
                        <div class="decp-tile-anchor-line">
                          <span class="decp-tile-anchor-id">{row.forCaseNumber}</span>
                          <span
                            lwc:if={row.forCaseSubject}
                            class="decp-tile-anchor-dash"
                            >·</span
                          >
                          <span
                            lwc:if={row.forCaseSubject}
                            class="decp-tile-anchor-subj"
                            >{row.forCaseSubject}</span
                          >
                          <button
                            class="decp-tile-anchor-go"
                            type="button"
                            data-caseid={row.forCaseId}
                            title="Open the case this conflict was evaluated against"
                            onclick={handleOpenCase}
                          >Open</button>
                        </div>
                      </div>
                    </template>
                    <div class="decp-tile-subj">{row.subject}</div>
                    <div class="decp-tile-owner">
                      <div
                        class="decp-tile-av decp-tile-av--t1"
                      >{row.initials}</div>
                      <div class="decp-tile-owner-cols">
                        <div class="decp-tile-om">
                          <div class="decp-tile-olab">Other Partner</div>
                          <div class="decp-tile-oname">
                            {row.otherPartnerName}
                          </div>
                        </div>
                        <div class="decp-tile-cm">
                          <div class="decp-tile-clab">Client</div>
                          <div class="decp-tile-cname">{row.clientName}</div>
                        </div>
                      </div>
                    </div>
                    <div class="decp-tile-detail">
                      <lightning-formatted-rich-text
                        value={row.detailHtml}
                      ></lightning-formatted-rich-text>
                    </div>
                    <div class="decp-tile-foot">
                      <div
                        class="decp-tile-status decp-tile-status--t1"
                      >
                        <span
                          class="decp-tile-dot decp-tile-dot--t1"
                        ></span>
                        <span>Conflict active</span>
                      </div>
                      <button
                        class="decp-tile-open"
                        type="button"
                        data-caseid={row.otherCaseId}
                        title="Open the other party’s case"
                        onclick={handleOpenCase}
                      >
                        <span>Open case</span>
                        <svg
                          class="decp-tile-ico"
                          width="11"
                          height="11"
                          viewBox="0 0 24 24"
                          fill="none"
                          aria-hidden="true"
                        >
                          <line
                            x1="7"
                            y1="17"
                            x2="17"
                            y2="7"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                          />
                          <polyline
                            points="7 7 17 7 17 17"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                          />
                        </svg>
                      </button>
                    </div>
                  </article>
                </template>
              </div>
            </div>
          </template>
          <template lwc:if={hasType2Block}>
            <div class={type2SectionClass}>
              <div class="decp-th">
                <div class="decp-pill decp-t2p">Cross-party</div>
                <span class="decp-count">{type2Count} records</span>
                <div class="decp-rule-line"></div>
              </div>
              <div class="decp-ol decp-ol2">
                <div class="decp-ol-ico"></div>
                <span
                >A <b>cross-party</b> or related-matter flag exists. Review
                  with the other partner before you proceed.</span
                >
              </div>
              <div class="decp-grid">
                <template
                  for:each={type2ForView}
                  for:item="row"
                >
                  <article
                    class="decp-tile decp-tile--t2"
                    key={row.key}
                  >
                    <div class="decp-tile-top">
                      <div class="decp-tile-caseid">
                        <svg
                          class="decp-tile-ico"
                          width="10"
                          height="10"
                          viewBox="0 0 24 24"
                          fill="none"
                          aria-hidden="true"
                        >
                          <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="2"
                            stroke="#0070D2"
                            stroke-width="2.5"
                          />
                          <path
                            d="M3 9h18M9 21V9"
                            stroke="#0070D2"
                            stroke-width="2.5"
                          />
                        </svg>
                        <span>{row.caseNumber}</span>
                      </div>
                      <div
                        class="decp-tile-type decp-tile-type--t2"
                      >
                        <svg
                          class="decp-tile-ico"
                          width="9"
                          height="9"
                          viewBox="0 0 24 24"
                          fill="none"
                          aria-hidden="true"
                        >
                          <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linejoin="round"
                          />
                          <line
                            x1="12"
                            y1="9"
                            x2="12"
                            y2="13"
                            stroke="currentColor"
                            stroke-width="2.2"
                          />
                        </svg>
                        <span>Cross-party</span>
                      </div>
                    </div>
                    <template lwc:if={row.showForCase}>
                      <div class="decp-tile-anchor decp-tile-anchor--t2">
                        <div class="decp-tile-anchor-lab">Checked in context of</div>
                        <div class="decp-tile-anchor-line">
                          <span class="decp-tile-anchor-id">{row.forCaseNumber}</span>
                          <span
                            lwc:if={row.forCaseSubject}
                            class="decp-tile-anchor-dash"
                            >·</span
                          >
                          <span
                            lwc:if={row.forCaseSubject}
                            class="decp-tile-anchor-subj"
                            >{row.forCaseSubject}</span
                          >
                          <button
                            class="decp-tile-anchor-go"
                            type="button"
                            data-caseid={row.forCaseId}
                            title="Open the case this conflict was evaluated against"
                            onclick={handleOpenCase}
                          >Open</button>
                        </div>
                      </div>
                    </template>
                    <div class="decp-tile-subj">{row.subject}</div>
                    <div class="decp-tile-owner">
                      <div
                        class="decp-tile-av decp-tile-av--t2"
                      >{row.initials}</div>
                      <div class="decp-tile-owner-cols">
                        <div class="decp-tile-om">
                          <div class="decp-tile-olab">Other Partner</div>
                          <div class="decp-tile-oname">
                            {row.otherPartnerName}
                          </div>
                        </div>
                        <div class="decp-tile-cm">
                          <div class="decp-tile-clab">Client</div>
                          <div class="decp-tile-cname">{row.clientName}</div>
                        </div>
                      </div>
                    </div>
                    <div class="decp-tile-detail">
                      <lightning-formatted-rich-text
                        value={row.detailHtml}
                      ></lightning-formatted-rich-text>
                    </div>
                    <div class="decp-tile-foot">
                      <div
                        class="decp-tile-status decp-tile-status--t2"
                      >
                        <span
                          class="decp-tile-dot decp-tile-dot--t2"
                        ></span>
                        <span>Conflict active</span>
                      </div>
                      <button
                        class="decp-tile-open"
                        type="button"
                        data-caseid={row.otherCaseId}
                        title="Open the other party’s case"
                        onclick={handleOpenCase}
                      >
                        <span>Open case</span>
                        <svg
                          class="decp-tile-ico"
                          width="11"
                          height="11"
                          viewBox="0 0 24 24"
                          fill="none"
                          aria-hidden="true"
                        >
                          <line
                            x1="7"
                            y1="17"
                            x2="17"
                            y2="7"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                          />
                          <polyline
                            points="7 7 17 7 17 17"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                          />
                        </svg>
                      </button>
                    </div>
                  </article>
                </template>
              </div>
            </div>
          </template>
        </div>
        <div class="decp-ft">
          <div class="decp-ftn">All conflicts must be reviewed before proceeding.</div>
          <div class="decp-fts">
            <button
              class="decp-bbtn"
              type="button"
              onclick={handleDismiss}
            >
              Dismiss
            </button>
            <button
              class="decp-pbtn"
              type="button"
              onclick={handleProceed}
            >
              Proceed anyway
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#fff"
                stroke-width="2.5"
                aria-hidden="true"
              >
                <line
                  x1="5"
                  y1="12"
                  x2="19"
                  y2="12"
                />
                <polyline points="12 5 19 12 12 19" />
              </svg>
            </button>
          </div>
        </div>
      </template>
      <template lwc:elseif={showSuccessState}>
        <div class="decp-success-strip">
          <div
            class="decp-ol-ico"
            style="background: #d1fae5"
            aria-hidden="true"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
            >
              <path
                d="M9 12l2 2 4-4"
                fill="none"
                stroke="#047857"
                stroke-width="2.2"
              />
            </svg>
          </div>
          <div>
            <div class="decp-success-t">No business conflict in this scope</div>
            <div class="decp-success-body">
              <lightning-formatted-rich-text
                lwc:if={contextStripHtmlNoConflict}
                value={contextStripHtmlNoConflict}
              >
              </lightning-formatted-rich-text>
            </div>
          </div>
        </div>
        <div class="decp-ft">
          <div class="decp-ftn">You can proceed with new work, subject to your firm’s policies.</div>
        </div>
      </template>
      <template lwc:elseif={showEmptyState}>
        <div class="decp-in">
          <p class="slds-text-body_small slds-text-color_weak">Preparing conflict check…</p>
        </div>
      </template>
      </template>
    </div>
  </div>
</template>
